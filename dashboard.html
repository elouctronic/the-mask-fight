<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Battle Royale IRL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style id="base-style">
:root{
  --glass-bg: rgba(255,255,255,0.12);
  --glass-border: rgba(255,255,255,0.22);
  --glass-highlight: rgba(255,255,255,0.45);
  --shadow-soft: 0 8px 25px rgba(0,0,0,0.25);
  --radius: 20px;
  --blur: 22px;
  --text-light: #f0f0f0;
}

body{
  font-family:'Segoe UI',system-ui,sans-serif;
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#0d0d0d;
  color:var(--text-light);
  padding:20px;
  box-sizing:border-box;
  overflow-x:hidden;
}

/* Background animé doux */
#animated-bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background-size:260% 260%;
  animation:softFlow 22s ease-in-out infinite;
  filter:blur(60px) saturate(1.2);
  opacity:0.8;
}

@keyframes softFlow{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

h1{
  font-size:2.2rem;
  margin-bottom:25px;
  letter-spacing:1px;
  text-align:center;
  font-weight:600;
  backdrop-filter:blur(12px);
  padding:12px 26px;
  border-radius:var(--radius);
  background:rgba(255,255,255,0.06);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow-soft);
}

h2{
  margin-top:35px;
  margin-bottom:12px;
  opacity:0.85;
  font-weight:500;
  letter-spacing:0.5px;
}

/* Cartes joueurs */
.player{
  backdrop-filter:blur(var(--blur)) saturate(1.3);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  padding:22px;
  margin:14px 0;
  border-radius:var(--radius);
  width:100%;
  max-width:650px;
  box-shadow:var(--shadow-soft);
  transition:0.25s ease;
  position:relative;
}

.player:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,0.16);
}

/* Boutons */
button{
  padding:10px 16px;
  font-size:15px;
  cursor:pointer;
  border:none;
  border-radius:10px;
  color:#fff;
  font-weight:600;
  transition:0.25s ease;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.25);
}

button:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,0.26);
}

/* Notifications */
.notif{
  padding:14px;
  margin:10px 0;
  border-radius:var(--radius);
  font-weight:500;
  backdrop-filter:blur(14px) saturate(1.3);
  background:rgba(255,255,255,0.10);
  border:1px solid var(--glass-border);
  animation:fadeIn 0.4s ease;
  box-shadow:var(--shadow-soft);
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(-6px);}
  to{opacity:1; transform:translateY(0);}
}

/* Flash hit */
.flash-hit{
  animation:flashRed 0.35s;
}
@keyframes flashRed{
  0%{background:rgba(255,0,0,0.18);}
  100%{background:transparent;}
}

/* Flash heal */
.flash-heal{
  animation:flashGreen 0.35s;
}
@keyframes flashGreen{
  0%{background:rgba(0,255,0,0.18);}
  100%{background:transparent;}
}
</style>

<style id="dynamic-style"></style>
</head>

<body>

<div id="animated-bg"></div>

<h1 id="duoName"></h1>

<h2>Mon binôme</h2>
<div id="myTeam"></div>

<h2>Autres équipes</h2>
<div id="otherTeams"></div>

<h2>Notifications</h2>
<div id="notifications"></div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<script>
const BACKEND_URL="https://the-mask-fight.onrender.com";
const duoId=(localStorage.getItem("duoId")||"").trim();
let socket;

if(!duoId){
  alert("Aucun binôme détecté.");
  window.location.href="index.html";
}

/* THEMES */
const themes={
Bolchevik:{
  gradient:"linear-gradient(-45deg,#4a0000,#8a0000,#2a0000,#660000)",
  button:"#ff4d4d",
  glow:"0 0 20px rgba(255,80,80,0.6)"
},
JELP:{
  gradient:"linear-gradient(-45deg,#002a66,#0055cc,#001a40,#3388ff)",
  button:"#4da3ff",
  glow:"0 0 20px rgba(80,140,255,0.6)"
},
SpawnKill:{
  gradient:"linear-gradient(-45deg,#111,#333,#000,#555)",
  button:"#e0e0e0",
  glow:"0 0 20px rgba(255,255,255,0.4)"
},
"11br":{
  gradient:"linear-gradient(-45deg,#4d3d00,#806600,#2a2200,#ffdd33)",
  button:"#ffea55",
  glow:"0 0 20px rgba(255,230,120,0.6)"
},
Yanjacis:{
  gradient:"linear-gradient(-45deg,#003300,#009933,#002200,#00cc66)",
  button:"#33ff99",
  glow:"0 0 20px rgba(0,255,150,0.6)"
}
};

function applyTheme(team){
  const theme=themes[team];
  if(!theme)return;

  document.getElementById("dynamic-style").innerHTML=`
    #animated-bg{background:${theme.gradient};}
    button{background:${theme.button}; box-shadow:${theme.glow};}
    h1{text-shadow:${theme.glow};}
  `;
}

async function loadPlayers(){
  const res=await fetch(`${BACKEND_URL}/api/players`);
  const players=await res.json();

  const myDiv=document.getElementById("myTeam");
  const otherDiv=document.getElementById("otherTeams");
  myDiv.innerHTML="";
  otherDiv.innerHTML="";

  const grouped={};
  players.forEach(p=>{
    const key=(p.duo||"").trim();
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(p);
  });

  const myTeamKey=Object.keys(grouped).find(
    k=>k.toLowerCase()===duoId.toLowerCase()
  );

  if(myTeamKey){
    grouped[myTeamKey].forEach(p=>{
      const container=document.createElement("div");
      container.className="player";
      container.innerHTML=`
        <h3>${p.name}</h3>
        <p>Vies restantes : ${p.lives}</p>
        ${p.lives>0?`
          <div class="player-actions">
            <button onclick="hit('${p.id}')">Touché</button>
            <button onclick="heal('${p.id}')">Heal</button>
          </div>
        `:"<p>Éliminé 💀</p>"}
      `;
      myDiv.appendChild(container);
    });
    delete grouped[myTeamKey];
  }

  Object.keys(grouped).forEach(team=>{
    const teamDiv=document.createElement("div");
    teamDiv.innerHTML=`<h3>${team}</h3>`;
    grouped[team].forEach(p=>{
      const container=document.createElement("div");
      container.className="player";
      container.innerHTML=`
        <strong>${p.name}</strong> — ${p.lives} vies
        ${p.lives===0?" 💀":""}
      `;
      teamDiv.appendChild(container);
    });
    otherDiv.appendChild(teamDiv);
  });
}

async function hit(playerId){
  document.body.classList.add("flash-hit");
  setTimeout(()=>document.body.classList.remove("flash-hit"),350);

  await fetch(`${BACKEND_URL}/api/touche`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playerId,duoId})
  });
  loadPlayers();
}

async function heal(playerId){
  document.body.classList.add("flash-heal");
  setTimeout(()=>document.body.classList.remove("flash-heal"),350);

  await fetch(`${BACKEND_URL}/api/heal`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playerId,duoId})
  });
  loadPlayers();
}

function initSocket(){
  socket=io(BACKEND_URL,{transports:["websocket"]});

  socket.on("notif",(payload)=>{
    let message="";

    if(payload.type==="hit"){
      message=`⚡ ${payload.duo} - ${payload.player} a perdu une vie (${payload.lives})`;
    }else if(payload.type==="eliminated"){
      message=`💀 ${payload.duo} - ${payload.player} est éliminé !`;
    }else if(payload.type==="heal"){
      message=`💚 ${payload.duo} - ${payload.player} soigné (${payload.lives})`;
    }else if(payload.type==="reset"){
      message=`🔄 ${payload.message}`;
    }

    if(message){
      const div=document.createElement("div");
      div.className="notif";
      div.textContent=message;
      document.getElementById("notifications").prepend(div);
      loadPlayers();
    }
  });
}

(async()=>{
  applyTheme(duoId);
  document.getElementById("duoName").innerText=`Équipe ${duoId}`;
  await loadPlayers();
  initSocket();
})();
</script>

</body>
</html>
