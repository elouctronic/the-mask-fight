<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Battle Royale IRL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Style de base -->
  <style id="base-style">
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      color: #eee;
      padding: 0 10px;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    /* Calque d’animation */
    #animated-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      opacity: 0.45;
      background: transparent;
    }

    h1 { text-align: center; margin: 15px 0; font-size: 1.8rem; font-weight: 700; }
    h2 { margin-top: 20px; margin-bottom: 10px; font-size: 1.4rem; }
    h3 { margin-top: 20px; margin-bottom: 10px; font-size: 1.2rem; }

    .player {
      border: 1px solid #444;
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      background: rgba(20,20,20,0.85);
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      width: 100%;
      box-sizing: border-box;
      backdrop-filter: blur(4px);
    }

    /* Boutons stylés */
    button {
      margin-top: 8px;
      padding: 12px 15px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 8px;
      border: none;
      border-radius: 8px;
      color: #fff;
      transition: 0.25s ease;
      min-height: 44px;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }

    /* Effet ripple */
    button::after {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      top: var(--y);
      left: var(--x);
      opacity: 0;
      transition: width 0.4s ease, height 0.4s ease, opacity 0.4s ease;
    }

    button:active::after {
      width: 200px;
      height: 200px;
      opacity: 1;
    }

    /* Hover 3D */
    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    #notifications { margin-top: 20px; width: 100%; max-width: 600px; }
    .notif { padding: 10px; margin: 5px 0; border-radius: 5px; font-weight: bold; text-align: center; }

    .player-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .player-actions button { flex: 1; min-width: 120px; }
  </style>

  <!-- Style dynamique -->
  <style id="dynamic-style"></style>
</head>
