<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Battle Royale IRL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style id="dynamic-style">
    /* Styles de base */
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000;
      color: #eee;
      padding: 0 10px;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    /* Calque d’animation */
    #animated-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      opacity: 0.35;
    }

    h1 { text-align: center; margin: 15px 0; font-size: 1.5rem; }
    h2 { margin-top: 20px; margin-bottom: 10px; font-size: 1.3rem; }
    h3 { margin-top: 20px; margin-bottom: 10px; font-size: 1.1rem; }

    .player {
      border: 1px solid #444;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      background: rgba(20,20,20,0.8);
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
      width: 100%;
      box-sizing: border-box;
    }

    button {
      margin-top: 8px;
      padding: 12px 15px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 8px;
      border: none;
      border-radius: 6px;
      color: #fff;
      transition: 0.3s;
      min-height: 44px;
    }

    #notifications { margin-top: 20px; width: 100%; max-width: 600px; }
    .notif { padding: 10px; margin: 5px 0; border-radius: 5px; font-weight: bold; text-align: center; }

    .player-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .player-actions button { flex: 1; min-width: 120px; }

    @media (min-width: 768px) {
      body { padding: 0 20px; }
      h1 { font-size: 2rem; margin-top: 25px; }
      h2 { font-size: 1.5rem; margin-top: 30px; }
      .player { padding: 15px; margin: 10px 0; }
      .player-actions { flex-wrap: nowrap; }
    }

    @media (max-width: 360px) {
      h1 { font-size: 1.3rem; }
      h2 { font-size: 1.1rem; }
      button { padding: 10px 12px; font-size: 14px; }
    }
  </style>
</head>

<body>
  <div id="animated-bg"></div>

  <h1 id="duoName"></h1>

  <h2>Mon binôme</h2>
  <div id="myTeam"></div>

  <h2>Autres équipes</h2>
  <div id="otherTeams"></div>

  <h3>Notifications</h3>
  <div id="notifications"></div>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script>
    const BACKEND_URL = "https://the-mask-fight.onrender.com";
    const duoId = (localStorage.getItem("duoId") || "").trim();
    let socket;

    if (!duoId) {
      alert("Aucun binôme détecté, retour au login.");
      window.location.href = "index.html";
    }

    /* 🎨 Thèmes + animations */
    const themes = {
      Bolchevik: {
        background: "linear-gradient(135deg, #8b0000, #000000)",
        button: "linear-gradient(135deg, #ff0000, #8b0000)",
        notif: "#ff4444",
        darkText: false,
        animation: `
          #animated-bg {
            background: radial-gradient(circle, rgba(255,0,0,0.4), transparent);
            animation: smoke 6s infinite alternate ease-in-out;
          }
          @keyframes smoke {
            0% { transform: translate(-20px, -20px) scale(1); }
            100% { transform: translate(20px, 20px) scale(1.3); }
          }
        `
      },

      JELP: {
        background: "linear-gradient(135deg, #0033cc, #000000)",
        button: "linear-gradient(135deg, #0066ff, #0033cc)",
        notif: "#3399ff",
        darkText: false,
        animation: `
          #animated-bg {
            background: linear-gradient(120deg, rgba(0,80,255,0.4), transparent);
            animation: waves 5s infinite linear;
          }
          @keyframes waves {
            0% { transform: translateX(-50px); }
            100% { transform: translateX(50px); }
          }
        `
      },

      SpawnKill: {
        background: "linear-gradient(135deg, #ffffff, #cccccc)",
        button: "linear-gradient(135deg, #eeeeee, #bbbbbb)",
        notif: "#ffffff",
        darkText: true,
        animation: `
          #animated-bg {
            background: repeating-linear-gradient(
              90deg,
              rgba(255,255,255,0.3) 0px,
              rgba(255,255,255,0.3) 2px,
              transparent 2px,
              transparent 4px
            );
            animation: glitch 0.8s infinite;
          }
          @keyframes glitch {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
          }
        `
      },

      "11br": {
        background: "linear-gradient(135deg, #ffd700, #000000)",
        button: "linear-gradient(135deg, #ffea00, #ffd700)",
        notif: "#ffea00",
        darkText: true,
        animation: `
          #animated-bg {
            background: radial-gradient(circle, rgba(255,230,0,0.4), transparent);
            animation: pulse 2s infinite ease-in-out;
          }
          @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.3); opacity: 0.5; }
          }
        `
      },

      Yanjacis: {
        background: "linear-gradient(135deg, #006400, #000000)",
        button: "linear-gradient(135deg, #00cc00, #006400)",
        notif: "#00ff00",
        darkText: false,
        animation: `
          #animated-bg {
            background: radial-gradient(circle, rgba(0,255,0,0.3), transparent);
            animation: particles 3s infinite ease-in-out;
          }
          @keyframes particles {
            0% { transform: translateY(0); }
            100% { transform: translateY(-40px); }
          }
        `
      }
    };

    function applyTheme(team) {
      const style = document.getElementById("dynamic-style");
      const theme = themes[team];
      if (!theme) return;

      style.innerHTML += `
        body { background: ${theme.background}; }
        button { background: ${theme.button}; color: ${theme.darkText ? "#000" : "#fff"}; }
        .notif { background: ${theme.notif}; color: ${theme.darkText ? "#000" : "#000"}; }
        ${theme.animation}
      `;
    }

    async function loadPlayers() {
      const res = await fetch(`${BACKEND_URL}/api/players`);
      const players = await res.json();

      const myDiv = document.getElementById("myTeam");
      const otherDiv = document.getElementById("otherTeams");
      myDiv.innerHTML = "";
      otherDiv.innerHTML = "";

      const grouped = {};
      players.forEach(p => {
        const key = (p.duo || "").trim();
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(p);
      });

      const myTeamKey = Object.keys(grouped).find(
        k => k.toLowerCase() === duoId.toLowerCase()
      );

      if (myTeamKey) {
        grouped[myTeamKey].forEach(p => {
          const container = document.createElement("div");
          container.className = "player";
          container.innerHTML = `
            <h3>${p.name}</h3>
            <p>Vies restantes: ${p.lives}</p>
            ${p.lives > 0 ? `
              <div class="player-actions">
                <button onclick="hit('${p.id}')">Touché</button>
                <button onclick="heal('${p.id}')">Heal</button>
              </div>
            ` : "<p>Éliminé 💀</p>"}
          `;
          myDiv.appendChild(container);
        });
        delete grouped[myTeamKey];
      }

      Object.keys(grouped).forEach(team => {
        const teamDiv = document.createElement("div");
        teamDiv.innerHTML = `<h3>${team}</h3>`;
        grouped[team].forEach(p => {
          const container = document.createElement("div");
          container.className = "player";
          container.innerHTML = `
            <strong>${p.name}</strong> — Vies restantes: ${p.lives}
            ${p.lives === 0 ? " 💀" : ""}
          `;
          teamDiv.appendChild(container);
        });
        otherDiv.appendChild(teamDiv);
      });
    }

    async function hit(playerId) {
      const res = await fetch(`${BACKEND_URL}/api/touche`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ playerId, duoId })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);
      loadPlayers();
    }

    async function heal(playerId) {
      const res = await fetch(`${BACKEND_URL}/api/heal`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ playerId, duoId })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);
      loadPlayers();
    }

    function initSocket() {
      socket = io(BACKEND_URL, { transports: ["websocket"] });
      socket.on("notif", (payload) => {
        let message = "";

        if (payload.type === "hit") {
          message = `⚡ ${payload.duo} - ${payload.player} a perdu une vie (reste ${payload.lives})`;
        } else if (payload.type === "eliminated") {
          message = `💀 ${payload.duo} - ${payload.player} est éliminé !`;
        } else if (payload.type === "heal") {
          message = `💚 ${payload.duo} - ${payload.player} a été soigné (vies: ${payload.lives})`;
        } else if (payload.type === "reset") {
          message = `🔄 ${payload.message}`;
        }

        if (message) {
          const div = document.createElement("div");
          div.className = "notif";
          div.textContent = message;
          document.getElementById("notifications").prepend(div);

          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("Battle Royale IRL", {
              body: message,
              icon: "/icon.png"
            });
          }

          if ((payload.type === "hit" || payload.type === "eliminated") && navigator.vibrate) {
            navigator.vibrate([500, 200, 500]);
          }

          loadPlayers();
        }
      });
    }

    (async () => {
      applyTheme(duoId);
      document.getElementById("duoName").innerText = `Équipe ${duoId}`;
      await loadPlayers();
      initSocket();

      setInterval(async () => {
        try { await fetch(`${BACKEND_URL}/ping`); } catch (e) {}
      }, 60000);
    })();
  </script>
</body>
</html>
