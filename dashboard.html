<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Battle Royale IRL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style id="base-style">
:root{
  --glass: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.15);
  --shadow: 0 10px 30px rgba(0,0,0,0.6);
}

body{
  font-family:'Segoe UI',system-ui,sans-serif;
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#000;
  color:#f5f5f5;
  padding:20px;
  box-sizing:border-box;
  overflow-x:hidden;
}

/* Background animé */
#animated-bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background-size:400% 400%;
  animation:gradientMove 15s ease infinite;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

h1{
  font-size:2rem;
  margin-bottom:25px;
  letter-spacing:1px;
  text-align:center;
}

h2{
  margin-top:30px;
  margin-bottom:10px;
  opacity:0.8;
  font-weight:500;
}

.player{
  backdrop-filter:blur(14px);
  background:var(--glass);
  border:1px solid var(--border);
  padding:16px;
  margin:10px 0;
  border-radius:14px;
  width:100%;
  max-width:600px;
  box-shadow:var(--shadow);
  transition:0.3s ease;
}

.player:hover{
  transform:translateY(-4px);
}

.player-actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

button{
  padding:10px 14px;
  font-size:14px;
  cursor:pointer;
  border:none;
  border-radius:8px;
  color:#fff;
  font-weight:600;
  transition:0.25s ease;
}

button:hover{
  transform:scale(1.05);
}

.notif{
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  font-weight:600;
  backdrop-filter:blur(10px);
  background:rgba(0,0,0,0.5);
  border:1px solid var(--border);
  animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(-10px);}
  to{opacity:1; transform:translateY(0);}
}

#notifications{
  width:100%;
  max-width:600px;
  margin-top:20px;
}

/* Flash hit */
.flash-hit{
  animation:flashRed 0.4s;
}
@keyframes flashRed{
  0%{background:rgba(255,0,0,0.3);}
  100%{background:transparent;}
}

/* Flash heal */
.flash-heal{
  animation:flashGreen 0.4s;
}
@keyframes flashGreen{
  0%{background:rgba(0,255,0,0.3);}
  100%{background:transparent;}
}

</style>

<style id="dynamic-style"></style>
</head>

<body>

<div id="animated-bg"></div>

<h1 id="duoName"></h1>

<h2>Mon binôme</h2>
<div id="myTeam"></div>

<h2>Autres équipes</h2>
<div id="otherTeams"></div>

<h2>Notifications</h2>
<div id="notifications"></div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<script>
const BACKEND_URL="https://the-mask-fight.onrender.com";
const duoId=(localStorage.getItem("duoId")||"").trim();
let socket;

if(!duoId){
  alert("Aucun binôme détecté.");
  window.location.href="index.html";
}

/* THEMES */
const themes={
Bolchevik:{
  gradient:"linear-gradient(-45deg,#3a0000,#7a0000,#1a0000,#550000)",
  button:"#ff1a1a",
  glow:"0 0 20px rgba(255,0,0,0.7)"
},
JELP:{
  gradient:"linear-gradient(-45deg,#001f4d,#0044cc,#000d33,#0066ff)",
  button:"#3399ff",
  glow:"0 0 20px rgba(0,100,255,0.7)"
},
SpawnKill:{
  gradient:"linear-gradient(-45deg,#111,#444,#000,#666)",
  button:"#ffffff",
  glow:"0 0 20px rgba(255,255,255,0.6)"
},
"11br":{
  gradient:"linear-gradient(-45deg,#332b00,#665500,#1a1400,#ffcc00)",
  button:"#ffdd00",
  glow:"0 0 20px rgba(255,230,0,0.7)"
},
Yanjacis:{
  gradient:"linear-gradient(-45deg,#002b00,#006600,#001a00,#00cc44)",
  button:"#00ff66",
  glow:"0 0 20px rgba(0,255,100,0.7)"
}
};

function applyTheme(team){
  const theme=themes[team];
  if(!theme)return;

  document.getElementById("dynamic-style").innerHTML=`
    #animated-bg{background:${theme.gradient};}
    button{background:${theme.button}; box-shadow:${theme.glow};}
    h1{text-shadow:${theme.glow};}
  `;
}

async function loadPlayers(){
  const res=await fetch(`${BACKEND_URL}/api/players`);
  const players=await res.json();

  const myDiv=document.getElementById("myTeam");
  const otherDiv=document.getElementById("otherTeams");
  myDiv.innerHTML="";
  otherDiv.innerHTML="";

  const grouped={};
  players.forEach(p=>{
    const key=(p.duo||"").trim();
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(p);
  });

  const myTeamKey=Object.keys(grouped).find(
    k=>k.toLowerCase()===duoId.toLowerCase()
  );

  if(myTeamKey){
    grouped[myTeamKey].forEach(p=>{
      const container=document.createElement("div");
      container.className="player";
      container.innerHTML=`
        <h3>${p.name}</h3>
        <p>Vies restantes : ${p.lives}</p>
        ${p.lives>0?`
          <div class="player-actions">
            <button onclick="hit('${p.id}')">Touché</button>
            <button onclick="heal('${p.id}')">Heal</button>
          </div>
        `:"<p>Éliminé 💀</p>"}
      `;
      myDiv.appendChild(container);
    });
    delete grouped[myTeamKey];
  }

  Object.keys(grouped).forEach(team=>{
    const teamDiv=document.createElement("div");
    teamDiv.innerHTML=`<h3>${team}</h3>`;
    grouped[team].forEach(p=>{
      const container=document.createElement("div");
      container.className="player";
      container.innerHTML=`
        <strong>${p.name}</strong> — ${p.lives} vies
        ${p.lives===0?" 💀":""}
      `;
      teamDiv.appendChild(container);
    });
    otherDiv.appendChild(teamDiv);
  });
}

async function hit(playerId){
  document.body.classList.add("flash-hit");
  setTimeout(()=>document.body.classList.remove("flash-hit"),400);

  await fetch(`${BACKEND_URL}/api/touche`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playerId,duoId})
  });
  loadPlayers();
}

async function heal(playerId){
  document.body.classList.add("flash-heal");
  setTimeout(()=>document.body.classList.remove("flash-heal"),400);

  await fetch(`${BACKEND_URL}/api/heal`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playerId,duoId})
  });
  loadPlayers();
}

function initSocket(){
  socket=io(BACKEND_URL,{transports:["websocket"]});

  socket.on("notif",(payload)=>{
    let message="";

    if(payload.type==="hit"){
      message=`⚡ ${payload.duo} - ${payload.player} a perdu une vie (${payload.lives})`;
    }else if(payload.type==="eliminated"){
      message=`💀 ${payload.duo} - ${payload.player} est éliminé !`;
    }else if(payload.type==="heal"){
      message=`💚 ${payload.duo} - ${payload.player} soigné (${payload.lives})`;
    }else if(payload.type==="reset"){
      message=`🔄 ${payload.message}`;
    }

    if(message){
      const div=document.createElement("div");
      div.className="notif";
      div.textContent=message;
      document.getElementById("notifications").prepend(div);
      loadPlayers();
    }
  });
}

(async()=>{
  applyTheme(duoId);
  document.getElementById("duoName").innerText=`Équipe ${duoId}`;
  await loadPlayers();
  initSocket();
})();
</script>

</body>
</html>
