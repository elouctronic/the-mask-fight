<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Battle Royale IRL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style id="base-style">
/* ------------------------------ */
/* VARIABLES */
/* ------------------------------ */
:root{
  --bg1: #0d0d12;
  --bg2: #14141c;
  --bg3: #1a1a24;

  --card: #18181f;
  --card-hover: #1f1f28;
  --border: #2a2a33;

  --text: #f5f5f7;
  --text-soft: #c7c7d0;

  --accent: #4d7cff;
  --accent-soft: rgba(77,124,255,0.15);

  --radius: 14px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
  --transition: 0.25s cubic-bezier(.25,.1,.25,1);
}

/* ------------------------------ */
/* BACKGROUND GRADIENT PREMIUM */
/* ------------------------------ */
body{
  font-family:'Inter',system-ui,sans-serif;
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:
    radial-gradient(circle at 20% 20%, #1f1f2d 0%, transparent 60%),
    radial-gradient(circle at 80% 80%, #24243a 0%, transparent 60%),
    linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
  background-size: 200% 200%;
  animation:bgMove 18s ease-in-out infinite;
  color:var(--text);
  padding:40px 20px;
  box-sizing:border-box;
}

@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ------------------------------ */
/* TITRES */
/* ------------------------------ */
h1{
  font-size:2.4rem;
  margin-bottom:30px;
  font-weight:700;
  text-align:center;
  animation:fadeIn 0.6s ease;
}

h2{
  margin-top:40px;
  margin-bottom:14px;
  opacity:0.85;
  font-weight:500;
  text-align:center;
}

/* ------------------------------ */
/* CONTAINERS */
/* ------------------------------ */
#myTeam, #otherTeams, #notifications{
  width:100%;
  max-width:700px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ------------------------------ */
/* PLAYER CARD */
/* ------------------------------ */
.player{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  padding:22px 20px;
  margin:16px 0;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:var(--transition);
  transform:translateY(12px);
  opacity:0;
  animation:cardEnter 0.45s ease forwards;
}

@keyframes cardEnter{
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.player:hover{
  background:var(--card-hover);
  transform:translateY(-4px);
}

/* ------------------------------ */
/* BUTTONS */
/* ------------------------------ */
.player-actions{
  display:flex;
  gap:12px;
  margin-top:16px;
}

button{
  padding:10px 18px;
  font-size:15px;
  cursor:pointer;
  border:none;
  border-radius:var(--radius);
  color:#fff;
  font-weight:600;
  background:var(--accent);
  transition:0.2s cubic-bezier(.34,1.56,.64,1);
  transform:scale(0.92);
  opacity:0;
  animation:buttonPop 0.45s ease forwards;
}

@keyframes buttonPop{
  0%{opacity:0; transform:scale(0.7);}
  60%{opacity:1; transform:scale(1.05);}
  100%{opacity:1; transform:scale(1);}
}

button:hover{
  transform:scale(1.06);
  background:#6c92ff;
}

/* ------------------------------ */
/* NOTIFICATIONS */
/* ------------------------------ */
.notif{
  width:100%;
  padding:16px 18px;
  margin:12px 0;
  border-radius:var(--radius);
  background:var(--card);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  animation:fadeIn 0.35s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(-6px);}
  to{opacity:1; transform:translateY(0);}
}

/* ------------------------------ */
/* HIT / HEAL EFFECTS */
/* ------------------------------ */
.flash-hit{
  animation:hitFlash 0.5s ease;
}

@keyframes hitFlash{
  0%{background:rgba(255,60,60,0.25);}
  100%{background:transparent;}
}

.flash-heal{
  animation:healFlash 0.5s ease;
}

@keyframes healFlash{
  0%{background:rgba(60,255,120,0.25);}
  100%{background:transparent;}
}

/* ------------------------------ */
/* SPECIAL ANIMATIONS */
/* ------------------------------ */

/* Vie perdue : vibration + flash rouge */
@keyframes loseLife{
  0%{transform:translateX(0);}
  20%{transform:translateX(-6px);}
  40%{transform:translateX(6px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(4px);}
  100%{transform:translateX(0);}
}

/* Heal : pulse vert doux */
@keyframes healPulse{
  0%{box-shadow:0 0 0 0 rgba(60,255,120,0.4);}
  100%{box-shadow:0 0 0 18px rgba(60,255,120,0);}
}

.player.hit-anim{
  animation:loseLife 0.4s ease;
}

.player.heal-anim{
  animation:healPulse 0.6s ease;
}
</style>

<style id="dynamic-style"></style>
</head>

<body>

<h1 id="duoName"></h1>

<h2>Mon binôme</h2>
<div id="myTeam"></div>

<h2>Autres équipes</h2>
<div id="otherTeams"></div>

<h2>Notifications</h2>
<div id="notifications"></div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<script>
/* JS ORIGINAL — inchangé */
const BACKEND_URL="https://the-mask-fight.onrender.com";
const duoId=(localStorage.getItem("duoId")||"").trim();
let socket;

if(!duoId){
  alert("Aucun binôme détecté.");
  window.location.href="index.html";
}

const themes={
Bolchevik:{button:"#ff4d4d"},
JELP:{button:"#4da3ff"},
SpawnKill:{button:"#e0e0e0"},
"11br":{button:"#ffea55"},
Yanjacis:{button:"#33ff99"}
};

function applyTheme(team){
  const theme=themes[team];
  if(!theme)return;
  document.getElementById("dynamic-style").innerHTML=`
    button{background:${theme.button};}
  `;
}

async function loadPlayers(){
  const res=await fetch(`${BACKEND_URL}/api/players`);
  const players=await res.json();

  const myDiv=document.getElementById("myTeam");
  const otherDiv=document.getElementById("otherTeams");
  myDiv.innerHTML="";
  otherDiv.innerHTML="";

  const grouped={};
  players.forEach(p=>{
    const key=(p.duo||"").trim();
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(p);
  });

  const myTeamKey=Object.keys(grouped).find(
    k=>k.toLowerCase()===duoId.toLowerCase()
  );

  if(myTeamKey){
    grouped[myTeamKey].forEach(p=>{
      const container=document.createElement("div");
      container.className="player";
      container.id="player-"+p.id;

      container.innerHTML=`
        <h3>${p.name}</h3>
        <p>Vies restantes : <span class="life">${p.lives}</span></p>
        ${p.lives>0?`
          <div class="player-actions">
            <button onclick="hit('${p.id}')">Touché</button>
            <button onclick="heal('${p.id}')">Heal</button>
          </div>
        `:"<p>Éliminé 💀</p>"}
      `;
      myDiv.appendChild(container);
    });
    delete grouped[myTeamKey];
  }

  Object.keys(grouped).forEach(team=>{
    const teamDiv=document.createElement("div");
    teamDiv.innerHTML=`<h3>${team}</h3>`;
    grouped[team].forEach(p=>{
      const container=document.createElement("div");
      container.className="player";
      container.innerHTML=`
        <strong>${p.name}</strong> — ${p.lives} vies
        ${p.lives===0?" 💀":""}
      `;
      teamDiv.appendChild(container);
    });
    otherDiv.appendChild(teamDiv);
  });
}

async function hit(playerId){
  const card=document.getElementById("player-"+playerId);
  card.classList.add("hit-anim");

  setTimeout(()=>card.classList.remove("hit-anim"),500);

  document.body.classList.add("flash-hit");
  setTimeout(()=>document.body.classList.remove("flash-hit"),500);

  await fetch(`${BACKEND_URL}/api/touche`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playerId,duoId})
  });
  loadPlayers();
}

async function heal(playerId){
  const card=document.getElementById("player-"+playerId);
  card.classList.add("heal-anim");

  setTimeout(()=>card.classList.remove("heal-anim"),600);

  document.body.classList.add("flash-heal");
  setTimeout(()=>document.body.classList.remove("flash-heal"),500);

  await fetch(`${BACKEND_URL}/api/heal`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playerId,duoId})
  });
  loadPlayers();
}

function initSocket(){
  socket=io(BACKEND_URL,{transports:["websocket"]});

  socket.on("notif",(payload)=>{
    let message="";

    if(payload.type==="hit"){
      message=`⚡ ${payload.duo} - ${payload.player} a perdu une vie (${payload.lives})`;
    }else if(payload.type==="eliminated"){
      message=`💀 ${payload.duo} - ${payload.player} est éliminé !`;
    }else if(payload.type==="heal"){
      message=`💚 ${payload.duo} - ${payload.player} soigné (${payload.lives})`;
    }else if(payload.type==="reset"){
      message=`🔄 ${payload.message}`;
    }

    if(message){
      const div=document.createElement("div");
      div.className="notif";
      div.textContent=message;
      document.getElementById("notifications").prepend(div);
      loadPlayers();
    }
  });
}

(async()=>{
  applyTheme(duoId);
  document.getElementById("duoName").innerText=`Équipe ${duoId}`;
  await loadPlayers();
  initSocket();
})();
</script>

</body>
</html>
