<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Battle Royale IRL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style id="base-style">
:root{
  --glass-bg: rgba(15,15,20,0.45);
  --glass-border: rgba(255,255,255,0.22);
  --glass-border-strong: rgba(255,255,255,0.5);
  --glass-highlight: rgba(255,255,255,0.7);
  --shadow-soft: 0 18px 45px rgba(0,0,0,0.55);
  --radius: 22px;
  --blur: 24px;
  --text-light: #f7f7f7;
  --transition: 0.35s cubic-bezier(.25,.1,.25,1);
}

/* GLOBAL */
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#05060a;
  color:var(--text-light);
  padding:40px 20px;
  box-sizing:border-box;
  overflow-x:hidden;
}

/* BACKGROUND LIQUID DOUX */
#animated-bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background-size:260% 260%;
  animation:liquid 32s ease-in-out infinite;
  filter:blur(80px) saturate(1.2);
  opacity:0.7;
}

@keyframes liquid{
  0%{background-position:0% 40%;}
  50%{background-position:100% 60%;}
  100%{background-position:0% 40%;}
}

/* TITRES */
h1{
  font-size:2.3rem;
  margin-bottom:28px;
  text-align:center;
  font-weight:600;
  padding:14px 30px;
  border-radius:var(--radius);
  background:
    linear-gradient(135deg,
      rgba(255,255,255,0.16),
      rgba(255,255,255,0.04));
  border:1px solid rgba(255,255,255,0.28);
  box-shadow:0 14px 40px rgba(0,0,0,0.6);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

h2{
  margin-top:34px;
  margin-bottom:12px;
  opacity:0.9;
  font-weight:500;
  text-align:center;
}

/* CONTAINERS CENTRÉS */
#myTeam, #otherTeams, #notifications{
  width:100%;
  max-width:720px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* CARTE GLASS PREMIUM */
.player{
  width:100%;
  position:relative;
  margin:18px 0;
  padding:24px 22px;
  border-radius:var(--radius);
  background:
    radial-gradient(circle at top left,
      rgba(255,255,255,0.22),
      transparent 55%),
    radial-gradient(circle at bottom right,
      rgba(0,0,0,0.6),
      transparent 60%),
    linear-gradient(
      135deg,
      rgba(255,255,255,0.18),
      rgba(10,10,15,0.85)
    );
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow-soft);
  backdrop-filter:blur(var(--blur)) saturate(1.4);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);
  overflow:hidden;
  transition:var(--transition);
}

/* Liseré interne + reflets */
.player::before{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:calc(var(--radius) - 1px);
  border:1px solid rgba(255,255,255,0.12);
  pointer-events:none;
}

.player::after{
  content:"";
  position:absolute;
  top:-35%;
  left:-5%;
  width:55%;
  height:80%;
  background:radial-gradient(circle,
    rgba(255,255,255,0.45) 0%,
    transparent 60%);
  opacity:0.22;
  transform:rotate(-10deg);
  pointer-events:none;
}

/* Hover subtil */
.player:hover{
  transform:translateY(-6px);
  border-color:var(--glass-border-strong);
  box-shadow:0 22px 55px rgba(0,0,0,0.7);
  background:
    radial-gradient(circle at top left,
      rgba(255,255,255,0.26),
      transparent 55%),
    radial-gradient(circle at bottom right,
      rgba(0,0,0,0.65),
      transparent 60%),
    linear-gradient(
      135deg,
      rgba(255,255,255,0.2),
      rgba(8,8,12,0.9)
    );
}

/* NOTIF GLASS */
.notif{
  width:100%;
  margin:12px 0;
  padding:16px 18px;
  border-radius:var(--radius);
  background:
    radial-gradient(circle at top left,
      rgba(255,255,255,0.2),
      transparent 55%),
    linear-gradient(
      135deg,
      rgba(255,255,255,0.16),
      rgba(8,8,12,0.9)
    );
  border:1px solid rgba(255,255,255,0.24);
  box-shadow:0 14px 40px rgba(0,0,0,0.6);
  backdrop-filter:blur(24px) saturate(1.4);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  animation:fadeIn 0.45s ease;
}

/* BOUTONS GLASS */
.player-actions{
  display:flex;
  gap:12px;
  margin-top:16px;
}

button{
  padding:11px 18px;
  font-size:15px;
  cursor:pointer;
  border:none;
  border-radius:14px;
  color:#fff;
  font-weight:600;
  background:
    radial-gradient(circle at top left,
      rgba(255,255,255,0.4),
      transparent 55%),
    linear-gradient(
      135deg,
      rgba(255,255,255,0.26),
      rgba(180,180,210,0.4)
    );
  border:1px solid rgba(255,255,255,0.6);
  box-shadow:0 10px 26px rgba(0,0,0,0.55);
  backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  transform:scale(0.9);
  opacity:0;
  animation:buttonPop 0.55s cubic-bezier(.34,1.56,.64,1) forwards;
}

/* Boutons avec rebond */
@keyframes buttonPop{
  0%{opacity:0; transform:scale(0.7) translateY(8px);}
  60%{opacity:1; transform:scale(1.05) translateY(0);}
  100%{opacity:1; transform:scale(1);}
}

button:hover{
  transform:scale(1.04);
  box-shadow:0 14px 32px rgba(0,0,0,0.7);
}

/* FADE NOTIF */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(-6px);}
  to{opacity:1; transform:translateY(0);}
}

/* FLASH EFFECTS */
.flash-hit{
  animation:flashRed 0.45s ease;
}
@keyframes flashRed{
  0%{background:rgba(255,0,0,0.18);}
  100%{background:transparent;}
}

.flash-heal{
  animation:flashGreen 0.45s ease;
}
@keyframes flashGreen{
  0%{background:rgba(0,255,0,0.18);}
  100%{background:transparent;}
}
</style>
<style id="dynamic-style"></style>
</head>

<body>

<div id="animated-bg"></div>

<h1 id="duoName"></h1>

<h2>Mon binôme</h2>
<div id="myTeam"></div>

<h2>Autres équipes</h2>
<div id="otherTeams"></div>

<h2>Notifications</h2>
<div id="notifications"></div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<script>
const BACKEND_URL="https://the-mask-fight.onrender.com";
const duoId=(localStorage.getItem("duoId")||"").trim();
let socket;

if(!duoId){
  alert("Aucun binôme détecté.");
  window.location.href="index.html";
}

/* THEMES */
const themes={
Bolchevik:{
  gradient:"linear-gradient(-45deg,#3a0000,#7a0000,#1a0000,#550000)",
  button:"#ff4d4d",
  glow:"0 0 20px rgba(255,80,80,0.6)"
},
JELP:{
  gradient:"linear-gradient(-45deg,#001f4d,#0044cc,#000d33,#0066ff)",
  button:"#4da3ff",
  glow:"0 0 20px rgba(80,140,255,0.6)"
},
SpawnKill:{
  gradient:"linear-gradient(-45deg,#111,#444,#000,#666)",
  button:"#e0e0e0",
  glow:"0 0 20px rgba(255,255,255,0.4)"
},
"11br":{
  gradient:"linear-gradient(-45deg,#332b00,#665500,#1a1400,#ffcc00)",
  button:"#ffea55",
  glow:"0 0 20px rgba(255,230,120,0.6)"
},
Yanjacis:{
  gradient:"linear-gradient(-45deg,#002b00,#006600,#001a00,#00cc44)",
  button:"#33ff99",
  glow:"0 0 20px rgba(0,255,150,0.6)"
}
};

function applyTheme(team){
  const theme=themes[team];
  if(!theme)return;

  document.getElementById("dynamic-style").innerHTML=`
    #animated-bg{background:${theme.gradient};}
    button{background:${theme.button}; box-shadow:${theme.glow};}
    h1{text-shadow:${theme.glow};}
  `;
}

async function loadPlayers(){
  const res=await fetch(`${BACKEND_URL}/api/players`);
  const players=await res.json();

  const myDiv=document.getElementById("myTeam");
  const otherDiv=document.getElementById("otherTeams");
  myDiv.innerHTML="";
  otherDiv.innerHTML="";

  const grouped={};
  players.forEach(p=>{
    const key=(p.duo||"").trim();
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(p);
  });

  const myTeamKey=Object.keys(grouped).find(
    k=>k.toLowerCase()===duoId.toLowerCase()
  );

  if(myTeamKey){
    grouped[myTeamKey].forEach(p=>{
      const container=document.createElement("div");
      container.className="player";
      container.innerHTML=`
        <h3>${p.name}</h3>
        <p>Vies restantes : ${p.lives}</p>
        ${p.lives>0?`
          <div class="player-actions">
            <button onclick="hit('${p.id}')">Touché</button>
            <button onclick="heal('${p.id}')">Heal</button>
          </div>
        `:"<p>Éliminé 💀</p>"}
      `;
      myDiv.appendChild(container);
    });
    delete grouped[myTeamKey];
  }

  Object.keys(grouped).forEach(team=>{
    const teamDiv=document.createElement("div");
    teamDiv.innerHTML=`<h3>${team}</h3>`;
    grouped[team].forEach(p=>{
      const container=document.createElement("div");
      container.className="player";
      container.innerHTML=`
        <strong>${p.name}</strong> — ${p.lives} vies
        ${p.lives===0?" 💀":""}
      `;
      teamDiv.appendChild(container);
    });
    otherDiv.appendChild(teamDiv);
  });
}

async function hit(playerId){
  document.body.classList.add("flash-hit");
  setTimeout(()=>document.body.classList.remove("flash-hit"),450);

  await fetch(`${BACKEND_URL}/api/touche`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playerId,duoId})
  });
  loadPlayers();
}

async function heal(playerId){
  document.body.classList.add("flash-heal");
  setTimeout(()=>document.body.classList.remove("flash-heal"),450);

  await fetch(`${BACKEND_URL}/api/heal`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({playerId,duoId})
  });
  loadPlayers();
}

function initSocket(){
  socket=io(BACKEND_URL,{transports:["websocket"]});

  socket.on("notif",(payload)=>{
    let message="";

    if(payload.type==="hit"){
      message=`⚡ ${payload.duo} - ${payload.player} a perdu une vie (${payload.lives})`;
    }else if(payload.type==="eliminated"){
      message=`💀 ${payload.duo} - ${payload.player} est éliminé !`;
    }else if(payload.type==="heal"){
      message=`💚 ${payload.duo} - ${payload.player} soigné (${payload.lives})`;
    }else if(payload.type==="reset"){
      message=`🔄 ${payload.message}`;
    }

    if(message){
      const div=document.createElement("div");
      div.className="notif";
      div.textContent=message;
      document.getElementById("notifications").prepend(div);
      loadPlayers();
    }
  });
}

(async()=>{
  applyTheme(duoId);
  document.getElementById("duoName").innerText=`Équipe ${duoId}`;
  await loadPlayers();
  initSocket();
})();
</script>

</body>
</html>
