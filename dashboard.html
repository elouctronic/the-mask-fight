<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Battle Royale IRL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style id="dynamic-style">
/* ===== BASE ===== */
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(270deg, #000000, #111, #000);
  background-size: 400% 400%;
  animation: bgMove 15s ease infinite;
  color: #eee;
  padding: 0 10px;
  box-sizing: border-box;
  overflow-x: hidden;
}

@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

h1 {
  margin: 20px 0;
  font-size: 1.8rem;
  animation: fadeDown 1s ease;
}

h2, h3 {
  margin-top: 20px;
  margin-bottom: 10px;
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== PLAYER CARD ===== */
.player {
  border: 1px solid rgba(255,255,255,0.1);
  padding: 14px;
  margin: 10px 0;
  border-radius: 12px;
  background: rgba(20,20,20,0.7);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 15px rgba(0,0,0,0.6);
  width: 100%;
  box-sizing: border-box;
  transition: 0.4s ease;
  animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.player:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 0 25px rgba(255,255,255,0.15);
}

/* ===== LOW LIFE ===== */
.low-life {
  animation: pulseRed 1.5s infinite;
}

@keyframes pulseRed {
  0% { box-shadow: 0 0 10px rgba(255,0,0,0.4); }
  50% { box-shadow: 0 0 25px rgba(255,0,0,0.8); }
  100% { box-shadow: 0 0 10px rgba(255,0,0,0.4); }
}

/* ===== ELIMINATED ===== */
.eliminated {
  animation: eliminatedAnim 1s forwards;
}

@keyframes eliminatedAnim {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.5; filter: grayscale(1); }
}

/* ===== LIFE FLASH ===== */
.life-loss {
  animation: hitFlash 0.6s ease-out;
}
.life-gain {
  animation: healFlash 0.6s ease-out;
}

@keyframes hitFlash {
  0% { background-color: rgba(255,0,0,0.6); transform: scale(1.05); }
  100% { background-color: rgba(20,20,20,0.7); transform: scale(1); }
}

@keyframes healFlash {
  0% { background-color: rgba(0,255,0,0.4); transform: scale(1.05); }
  100% { background-color: rgba(20,20,20,0.7); transform: scale(1); }
}

/* ===== BUTTON ===== */
button {
  margin-top: 8px;
  padding: 12px 15px;
  font-size: 16px;
  cursor: pointer;
  margin-right: 8px;
  border: none;
  border-radius: 8px;
  color: #fff;
  position: relative;
  overflow: hidden;
  transition: 0.3s ease;
}

button:hover {
  transform: scale(1.05);
  filter: brightness(1.2);
  box-shadow: 0 0 15px rgba(255,255,255,0.3);
}

button:active {
  transform: scale(0.95);
}

button::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.2);
  top: 0;
  left: -100%;
  transition: 0.4s;
}
button:hover::after {
  left: 0;
}

/* ===== NOTIFICATIONS ===== */
#notifications {
  margin-top: 20px;
  width: 100%;
  max-width: 600px;
}

.notif {
  padding: 12px;
  margin: 6px 0;
  border-radius: 8px;
  font-weight: bold;
  text-align: center;
  backdrop-filter: blur(8px);
  animation: notifSlide 0.5s ease;
}

@keyframes notifSlide {
  from { opacity: 0; transform: translateX(-30px); }
  to { opacity: 1; transform: translateX(0); }
}
  </style>
</head>

<body>

<h1 id="duoName"></h1>

<h2>Mon binôme</h2>
<div id="myTeam"></div>

<h2>Autres équipes</h2>
<div id="otherTeams"></div>

<h3>Notifications</h3>
<div id="notifications"></div>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>
const BACKEND_URL = "https://the-mask-fight.onrender.com";
const duoId = (localStorage.getItem("duoId") || "").trim();
let socket;

if (!duoId) {
  alert("Aucun binôme détecté, retour au login.");
  window.location.href = "index.html";
}

/* 🎨 Thèmes */
const themes = {
  Bolchevik: { background: "linear-gradient(135deg, #8b0000, #000000)", button: "linear-gradient(135deg, #ff0000, #8b0000)", notif: "#ff4444", darkText: false },
  JELP: { background: "linear-gradient(135deg, #0033cc, #000000)", button: "linear-gradient(135deg, #0066ff, #0033cc)", notif: "#3399ff", darkText: false },
  SpawnKill: { background: "linear-gradient(135deg, #d9e4ff, #8fa4d4)", button: "linear-gradient(135deg, #b8c8f0, #6f82b8)", notif: "#dbe3ff", darkText: true },
  "11br": { background: "linear-gradient(135deg, #ffd700, #000000)", button: "linear-gradient(135deg, #ffea00, #ffd700)", notif: "#ffea00", darkText: true },
  Yanjacis: { background: "linear-gradient(135deg, #006400, #000000)", button: "linear-gradient(135deg, #00cc00, #006400)", notif: "#00ff00", darkText: false }
};

function applyTheme(team) {
  const style = document.getElementById("dynamic-style");
  const theme = themes[team];
  if (!theme) return;

  style.innerHTML += `
    body { background: ${theme.background}; }
    button { background: ${theme.button}; color: ${theme.darkText ? "#000" : "#fff"}; }
    .notif { background: ${theme.notif}; color: #000; }
  `;
}

let previousLives = {};

function applyLifeAnimation(container, player) {
  const old = previousLives[player.id];

  if (player.lives === 0) container.classList.add("eliminated");
  if (player.lives === 1) container.classList.add("low-life");

  if (old !== undefined && old !== player.lives) {
    if (player.lives < old) container.classList.add("life-loss");
    else container.classList.add("life-gain");

    setTimeout(() => container.classList.remove("life-loss", "life-gain"), 700);
  }

  previousLives[player.id] = player.lives;
}

async function loadPlayers() {
  const res = await fetch(`${BACKEND_URL}/api/players`);
  const players = await res.json();

  const myDiv = document.getElementById("myTeam");
  const otherDiv = document.getElementById("otherTeams");
  myDiv.innerHTML = "";
  otherDiv.innerHTML = "";

  const grouped = {};
  players.forEach(p => {
    const key = (p.duo || "").trim();
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(p);
  });

  const myTeamKey = Object.keys(grouped).find(
    k => k.toLowerCase() === duoId.toLowerCase()
  );

  if (myTeamKey) {
    grouped[myTeamKey].forEach(p => {
      const container = document.createElement("div");
      container.className = "player";
      container.innerHTML = `
        <h3>${p.name}</h3>
        <p>Vies restantes: ${p.lives}</p>
        ${p.lives > 0 ? `
          <div class="player-actions">
            <button onclick="hit('${p.id}')">Touché</button>
            <button onclick="heal('${p.id}')">Heal</button>
          </div>
        ` : "<p>Éliminé 💀</p>"}
      `;
      applyLifeAnimation(container, p);
      myDiv.appendChild(container);
    });
    delete grouped[myTeamKey];
  }

  Object.keys(grouped).forEach(team => {
    const teamDiv = document.createElement("div");
    teamDiv.innerHTML = `<h3>${team}</h3>`;
    grouped[team].forEach(p => {
      const container = document.createElement("div");
      container.className = "player";
      container.innerHTML = `<strong>${p.name}</strong> — Vies restantes: ${p.lives} ${p.lives === 0 ? "💀" : ""}`;
      applyLifeAnimation(container, p);
      teamDiv.appendChild(container);
    });
    otherDiv.appendChild(teamDiv);
  });
}

async function hit(playerId) {
  await fetch(`${BACKEND_URL}/api/touche`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ playerId, duoId })
  });
  loadPlayers();
}

async function heal(playerId) {
  await fetch(`${BACKEND_URL}/api/heal`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ playerId, duoId })
  });
  loadPlayers();
}

function initSocket() {
  socket = io(BACKEND_URL, { transports: ["websocket"] });

  socket.on("notif", (payload) => {
    let message = "";

    if (payload.type === "hit")
      message = `⚡ ${payload.duo} - ${payload.player} a perdu une vie (reste ${payload.lives})`;
    else if (payload.type === "eliminated")
      message = `💀 ${payload.duo} - ${payload.player} est éliminé !`;
    else if (payload.type === "heal")
      message = `💚 ${payload.duo} - ${payload.player} a été soigné (vies: ${payload.lives})`;
    else if (payload.type === "reset")
      message = `🔄 ${payload.message}`;

    if (message) {
      const div = document.createElement("div");
      div.className = "notif";
      div.textContent = message;
      document.getElementById("notifications").prepend(div);
      loadPlayers();
    }
  });
}

(async () => {
  applyTheme(duoId);
  document.getElementById("duoName").innerText = `Équipe ${duoId}`;
  await loadPlayers();
  initSocket();

  setInterval(async () => {
    try { await fetch(`${BACKEND_URL}/ping`); } catch(e){}
  }, 60000);
})();
</script>

</body>
</html>
