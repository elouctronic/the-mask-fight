<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Battle Royale IRL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style id="dynamic-style">

    /* ------------------------------
       BASE UI (VALORANT STYLE)
    ------------------------------ */

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0a0a0f;
      color: #e6e6e6;
      padding: 0 10px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 { margin: 20px 0; font-size: 1.8rem; }
    h2 { margin-top: 25px; font-size: 1.4rem; }
    h3 { margin-top: 20px; font-size: 1.1rem; }

    /* ------------------------------
       PLAYER CARD
    ------------------------------ */

    .player {
      border: 1px solid rgba(255,255,255,0.08);
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      background: rgba(20,20,30,0.85);
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      width: 100%;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      transition: 0.25s ease-out;
    }

    .player::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
      pointer-events: none;
    }

    /* ------------------------------
       BUTTONS (VALORANT STYLE)
    ------------------------------ */

    button {
      margin-top: 8px;
      padding: 12px 15px;
      font-size: 15px;
      cursor: pointer;
      border: 2px solid #ff4655;
      background: rgba(255,70,85,0.15);
      border-radius: 6px;
      color: #fff;
      transition: 0.2s ease-out;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: #ff4655;
      box-shadow: 0 0 12px #ff4655;
      transform: translateY(-2px);
    }

    .player-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .player-actions button {
      flex: 1;
      min-width: 120px;
    }

    /* ------------------------------
       NOTIFICATIONS (SLIDE + FADE)
    ------------------------------ */

    #notifications {
      margin-top: 20px;
      width: 100%;
      max-width: 600px;
    }

    .notif {
      padding: 12px;
      margin: 6px 0;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      background: rgba(255,255,255,0.1);
      animation: notifSlide 0.5s ease-out, notifFade 6s ease-out forwards;
    }

    @keyframes notifSlide {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes notifFade {
      0% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ------------------------------
       ANIMATIONS VALORANT
    ------------------------------ */

    /* HIT (impact rouge + shake + flash) */
    .life-loss {
      animation: hitFlash 0.22s cubic-bezier(.3,0,.2,1);
    }

    @keyframes hitFlash {
      0%   { background: rgba(255,0,40,0.55); transform: scale(1.08) translateX(0); }
      20%  { transform: scale(1.05) translateX(-4px); }
      40%  { transform: scale(1.05) translateX(4px); }
      60%  { transform: scale(1.03) translateX(-2px); }
      100% { background: rgba(20,20,30,0.85); transform: scale(1) translateX(0); }
    }

    /* HEAL (cyan/green glow + smooth scale) */
    .life-gain {
      animation: healFlash 0.35s cubic-bezier(.3,0,.2,1);
    }

    @keyframes healFlash {
      0%   { background: rgba(0,255,180,0.4); box-shadow: 0 0 20px rgba(0,255,200,0.6); transform: scale(1.05); }
      100% { background: rgba(20,20,30,0.85); box-shadow: none; transform: scale(1); }
    }

    @media (max-width: 360px) {
      button { padding: 10px 12px; font-size: 14px; }
    }

  </style>
</head>

<body>

  <h1 id="duoName"></h1>

  <h2>Mon binôme</h2>
  <div id="myTeam"></div>

  <h2>Autres équipes</h2>
  <div id="otherTeams"></div>

  <h3>Notifications</h3>
  <div id="notifications"></div>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

  <script>

    const BACKEND_URL = "https://the-mask-fight.onrender.com";
    const duoId = (localStorage.getItem("duoId") || "").trim();
    let socket;

    if (!duoId) {
      alert("Aucun binôme détecté, retour au login.");
      window.location.href = "index.html";
    }

    /* ------------------------------
       THEMES (SpawnKill amélioré)
    ------------------------------ */

    const themes = {
      Bolchevik: { background: "linear-gradient(135deg,#8b0000,#000)", button: "#ff0000", notif: "#ff4444", darkText: false },
      JELP: { background: "linear-gradient(135deg,#0033cc,#000)", button: "#0066ff", notif: "#3399ff", darkText: false },

      /* SpawnKill VALORANT STYLE */
      SpawnKill: { 
        background: "linear-gradient(135deg,#dce3ff,#7f8fc7)",
        button: "#b8c8f0",
        notif: "#dbe3ff",
        darkText: true
      },

      "11br": { background: "linear-gradient(135deg,#ffd700,#000)", button: "#ffea00", notif: "#ffea00", darkText: true },
      Yanjacis: { background: "linear-gradient(135deg,#006400,#000)", button: "#00cc00", notif: "#00ff00", darkText: false }
    };

    function applyTheme(team) {
      const style = document.getElementById("dynamic-style");
      const theme = themes[team];
      if (!theme) return;

      style.innerHTML += `
        body { background: ${theme.background}; }
        button { border-color: ${theme.button}; }
        .notif { background: ${theme.notif}; color: ${theme.darkText ? "#000" : "#000"}; }
      `;
    }

    /* ------------------------------
       ANIMATION MEMORY
    ------------------------------ */

    let previousLives = {};

    /* ------------------------------
       LOAD PLAYERS
    ------------------------------ */

    async function loadPlayers() {
      const res = await fetch(`${BACKEND_URL}/api/players`);
      const players = await res.json();

      const myDiv = document.getElementById("myTeam");
      const otherDiv = document.getElementById("otherTeams");
      myDiv.innerHTML = "";
      otherDiv.innerHTML = "";

      const grouped = {};
      players.forEach(p => {
        const key = (p.duo || "").trim();
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(p);
      });

      const myTeamKey = Object.keys(grouped).find(k => k.toLowerCase() === duoId.toLowerCase());

      function animateLife(container, player) {
        const old = previousLives[player.id];
        if (old !== undefined && old !== player.lives) {
          container.classList.add(player.lives < old ? "life-loss" : "life-gain");
          setTimeout(() => container.classList.remove("life-loss", "life-gain"), 500);
        }
        previousLives[player.id] = player.lives;
      }

      if (myTeamKey) {
        grouped[myTeamKey].forEach(p => {
          const card = document.createElement("div");
          card.className = "player";
          card.innerHTML = `
            <h3>${p.name}</h3>
            <p>Vies restantes : ${p.lives}</p>
            ${p.lives > 0 ? `
              <div class="player-actions">
                <button onclick="hit('${p.id}')">Touché</button>
                <button onclick="heal('${p.id}')">Heal</button>
              </div>
            ` : "<p>Éliminé 💀</p>"}
          `;
          animateLife(card, p);
          myDiv.appendChild(card);
        });
        delete grouped[myTeamKey];
      }

      Object.keys(grouped).forEach(team => {
        const teamDiv = document.createElement("div");
        teamDiv.innerHTML = `<h3>${team}</h3>`;
        grouped[team].forEach(p => {
          const card = document.createElement("div");
          card.className = "player";
          card.innerHTML = `
            <strong>${p.name}</strong> — Vies restantes : ${p.lives} ${p.lives === 0 ? "💀" : ""}
          `;
          animateLife(card, p);
          teamDiv.appendChild(card);
        });
        otherDiv.appendChild(teamDiv);
      });
    }

    /* ------------------------------
       ACTIONS
    ------------------------------ */

    async function hit(playerId) {
      const res = await fetch(`${BACKEND_URL}/api/touche`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ playerId, duoId })
      });
      const data = await res.json();
      if (!data.error) loadPlayers();
    }

    async function heal(playerId) {
      const res = await fetch(`${BACKEND_URL}/api/heal`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ playerId, duoId })
      });
      const data = await res.json();
      if (!data.error) loadPlayers();
    }

    /* ------------------------------
       SOCKET NOTIFS
    ------------------------------ */

    function initSocket() {
      socket = io(BACKEND_URL, { transports: ["websocket"] });

      socket.on("notif", payload => {
        let msg = "";

        if (payload.type === "hit") msg = `⚡ ${payload.duo} - ${payload.player} a perdu une vie (${payload.lives})`;
        if (payload.type === "eliminated") msg = `💀 ${payload.duo} - ${payload.player} est éliminé !`;
        if (payload.type === "heal") msg = `💚 ${payload.duo} - ${payload.player} a été soigné (${payload.lives})`;
        if (payload.type === "reset") msg = `🔄 ${payload.message}`;

        if (msg) {
          const div = document.createElement("div");
          div.className = "notif";
          div.textContent = msg;
          document.getElementById("notifications").prepend(div);
          loadPlayers();
        }
      });
    }

    /* ------------------------------
       INIT
    ------------------------------ */

    (async () => {
      applyTheme(duoId);
      document.getElementById("duoName").innerText = `Équipe ${duoId}`;
      await loadPlayers();
      initSocket();
    })();

  </script>

</body>
</html>
